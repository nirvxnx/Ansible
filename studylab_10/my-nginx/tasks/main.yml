- name: Include variables based on the OS family
  include_vars: "{{ ansible_os_family }}.yml"

- name: Install Nginx package (Debian-based)
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install Nginx package (RedHat-based)
  ansible.builtin.yum:
    name: "{{ nginx_package }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Upload Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_conf_path }}"
    owner: root
    group: root
    mode: 0644

- name: Ensure nginx group exists
  ansible.builtin.group:
    name: "{{ nginx_group }}"
    state: present
    system: true

- name: Ensure nginx user exists
  ansible.builtin.user:
    name: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    state: present
    shell: /sbin/nologin
    system: true


- name: Create logs directory
  ansible.builtin.file:
    path: "{{ nginx_logs_path }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
    mode: 0755

- name: Restart Nginx service
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: restarted
