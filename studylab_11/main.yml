- name: Установить postgresql
  hosts: web
  tasks: 
    - name: Install PostgreSQL
      apt:
        name: "{{ item }}"
        state: latest
        update_cache: true
      loop:
        - postgresql
        - postgresql-contrib
        - acl
        - python3-psycopg2
        - libpq-dev
        
    - name: Check if database exists
      command: psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='example_db';"
      register: db_check
      changed_when: false 
      failed_when: db_check.rc not in [0, 1]

    - name: Create database if it does not exist
      command: psql -U postgres -c "CREATE DATABASE example_db;"
      when: db_check.stdout.strip() == ""
      changed_when: true
        