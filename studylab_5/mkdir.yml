---
- name: Добавление локальных фактов
  hosts: all
  gather_facts: true
  tasks:
    - name: Создать директорию
      file:
        path: /etc/ansible/facts.d
        state: directory
        mode: '0755'

    - name: Передать файлы
      copy:
        src: example.fact
        dest: /etc/ansible/facts.d/example.fact
