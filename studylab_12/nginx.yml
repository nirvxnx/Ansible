---
- name: webserver
  become: true
  hosts: web
  tasks:
    - name: Установка nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Настройка Nginx
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Перезапуск Nginx
      
  handlers:
  - name: Перезапуск Nginx
    service:
      name: nginx
      state: restarted